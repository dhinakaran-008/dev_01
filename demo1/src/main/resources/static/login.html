<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MedCare — Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-container h2 {
      margin: 0 0 20px;
      text-align: center;
      color: #1177ff;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #1177ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .btn:hover {
      background: #0f5fd6;
    }
    .extra-links {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }
    .extra-links a {
      color: #1177ff;
      text-decoration: none;
    }
    .role-toggle {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }
    .role-toggle button {
      flex: 1;
      padding: 10px;
      border: 1px solid #1177ff;
      background: #fff;
      color: #1177ff;
      cursor: pointer;
    }
    .role-toggle button.active {
      background: #1177ff;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>MedCare Login</h2>
    <div class="role-toggle">
      <button class="active" id="patientBtn">Patient</button>
      <button id="doctorBtn">Doctor</button>
    </div>
    <form>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required />
      </div>
      <button type="submit" class="btn">Login</button>
      <div class="extra-links">
        <a href="#">Forgot Password?</a>
        <a href="#">Register</a>
      </div>
    </form>
  </div>

  <script>
    const patientBtn = document.getElementById('patientBtn');
    const doctorBtn = document.getElementById('doctorBtn');
    patientBtn.addEventListener('click', () => {
      patientBtn.classList.add('active');
      doctorBtn.classList.remove('active');
    });  
    doctorBtn.addEventListener('click', () => {
      doctorBtn.classList.add('active');
      patientBtn.classList.remove('active');
    });
  </script>
</body>
</html>
